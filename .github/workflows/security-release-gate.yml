name: Manual security release gate

on:
  push:
    branches:
      - 'verification/kubernetes-agent-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-agent-security-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test, integrate, scan, and inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE_VERSION: 0.7.3
      CANDIDATE_TAG: v0.7.3
      IMAGE: pasturestack/kubernetes-agent:v0.7.3
      DAPPER_IMAGE: pasturestack-kubernetes-agent-dapper:security-gate
      KUBERNETES_SERVER_VERSION: v1.36.4
      KUBE_APISERVER_SHA256: 90939ee07af61ac3701c665647f9ce27f2f988f5c7fff406aa5794fd3e6328a6
      KUBECTL_SHA256: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
      ETCD_TEST_IMAGE: quay.io/coreos/etcd:v3.7.1@sha256:3c66a5191d37a11af19f50ad49beed162a988bd1752eabc9fe6b164f7ee443e5
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      TRIVY_CACHE: /tmp/pasturestack-kubernetes-agent-trivy-cache
    steps:
      - name: Check out the complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 63aadf22a77e2a452ee03c38159740835dc313cf "$GITHUB_SHA"
          mkdir -p dist
          printf '%s\n' "$GITHUB_SHA" > dist/source-revision.txt
          docker version
          docker buildx version

      - name: Install checksum-pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go1.27.0.linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            'https://go.dev/dl/go1.27.0.linux-amd64.tar.gz'
          printf '%s  %s\n' \
            '675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685' \
            "$archive" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xzf "$archive"
          "$RUNNER_TEMP/go/bin/go" version
          printf '%s\n' "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          printf 'GOROOT=%s\n' "$RUNNER_TEMP/go" >> "$GITHUB_ENV"

      - name: Run the race detector on every Go module
        shell: bash
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local
          export GOFLAGS=-mod=mod
          export INCLUSTER_CONFIG=false
          export KUBECONFIG="$RUNNER_TEMP/kubernetes-agent-test-kubeconfig"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    insecure-skip-tls-verify: true' \
            '    server: "http://localhost:8080"' \
            '  name: "Default"' \
            'contexts:' \
            '- context:' \
            '    cluster: "Default"' \
            '    user: "Default"' \
            '  name: "Default"' \
            'current-context: "Default"' \
            'users:' \
            '- name: "Default"' \
            '  user:' \
            '    token: "test"' \
            > "$KUBECONFIG"
          go test -mod=mod -race -count=1 ./...
          (
            cd third_party/event-subscriber
            go test -mod=mod -race -count=1 ./...
          )
          (
            cd third_party/go-rancher-metadata
            go test -mod=mod -race -count=1 ./...
          )

      - name: Validate, test, and build twice reproducibly
        shell: bash
        run: |
          set -euo pipefail
          make dapper-image DAPPER_IMAGE="$DAPPER_IMAGE"
          run_dapper() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/source" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e DAPPER_UID="$(id -u)" \
              -e DAPPER_GID="$(id -g)" \
              -e ARCH=amd64 \
              -e GOFLAGS=-mod=mod \
              -e GOTOOLCHAIN=local \
              -e VERSION_OVERRIDE="$CANDIDATE_VERSION" \
              "$DAPPER_IMAGE" "$@"
          }
          run_dapper validate
          run_dapper test
          run_dapper build
          cp bin/kubernetes-agent dist/kubernetes-agent.first
          run_dapper build
          cmp dist/kubernetes-agent.first bin/kubernetes-agent
          mv dist/kubernetes-agent.first dist/kubernetes-agent
          sha256sum dist/kubernetes-agent > dist/kubernetes-agent.sha256
          go_version_output=$(docker run --rm \
            -v "$GITHUB_WORKSPACE:/source" \
            -e DAPPER_UID="$(id -u)" \
            -e DAPPER_GID="$(id -g)" \
            "$DAPPER_IMAGE" bash -lc 'go version -m /source/bin/kubernetes-agent')
          printf '%s\n' "$go_version_output" > dist/kubernetes-agent-go-version.txt
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source" \
            -e DAPPER_UID="$(id -u)" \
            -e DAPPER_GID="$(id -g)" \
            "$DAPPER_IMAGE" bash -lc \
            'cd /source && go list -mod=mod -m -f "{{if .Version}}{{.Path}}|{{.Version}}{{end}}" all' |
            tr '|' '\t' > dist/go-modules.tsv

      - name: Build and inspect the non-root runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DAPPER_UID="$(id -u)" \
            -e DAPPER_GID="$(id -g)" \
            -e ARCH=amd64 \
            -e GOFLAGS=-mod=mod \
            -e GOTOOLCHAIN=local \
            -e VERSION_OVERRIDE="$CANDIDATE_VERSION" \
            -e TAG="$CANDIDATE_TAG" \
            -e IMAGE_NAME="$IMAGE" \
            "$DAPPER_IMAGE" package
          test "$(cat dist/images)" = "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$CANDIDATE_VERSION"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --read-only "$IMAGE" --version 2>&1 | grep -F "$CANDIDATE_VERSION"
          if docker run --rm --entrypoint /bin/sh "$IMAGE" -c true >/dev/null 2>&1; then
            echo 'runtime image unexpectedly contains a shell' >&2
            exit 1
          fi
          license_container=$(docker create "$IMAGE")
          mkdir -p dist/runtime-licenses
          docker cp "$license_container:/licenses/." dist/runtime-licenses/
          docker rm "$license_container" >/dev/null
          cut -f1,2 dist/runtime-licenses/go-modules/MODULES.tsv | LC_ALL=C sort \
            > dist/runtime-license-modules.tsv
          LC_ALL=C sort dist/go-modules.tsv > dist/locked-go-modules.tsv
          diff -u dist/locked-go-modules.tsv dist/runtime-license-modules.tsv
          (
            cd dist/runtime-licenses/go-modules
            sha256sum -c SHA256SUMS
          )

      - name: Prove Kubernetes 1.36.4 API compatibility
        shell: bash
        run: scripts/integration-kubernetes

      - name: Run Go vulnerability analysis
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source" \
            -e DAPPER_UID="$(id -u)" \
            -e DAPPER_GID="$(id -g)" \
            -e GOFLAGS=-mod=mod \
            -e GOTOOLCHAIN=local \
            "$DAPPER_IMAGE" bash -lc \
            'cd /source && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -json ./...' \
            > dist/govulncheck.json
          if jq -e 'select(.finding?.trace[-1]?.function != null)' dist/govulncheck.json >/dev/null; then
            echo 'reachable Go vulnerability found' >&2
            exit 1
          fi

      - name: Scan source, runtime, and build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE"
          docker pull "$TRIVY_IMAGE"
          docker image inspect "$TRIVY_IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            grep -Fq 'aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
          test "$(docker run --rm "$TRIVY_IMAGE" --version)" = 'Version: 0.74.0'
          docker run --rm \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --cache-dir /root/.cache/trivy --download-db-only
          source_snapshot=$(mktemp -d "${RUNNER_TEMP}/agent-source.XXXXXX")
          git archive HEAD | tar -x -C "$source_snapshot"
          docker run --rm --network none \
            -v "$source_snapshot:/workspace:ro" \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/dist:/evidence" \
            "$TRIVY_IMAGE" fs --cache-dir /root/.cache/trivy \
            --skip-db-update --offline-scan --scanners vuln,secret --format json \
            --output /evidence/source-scan.json /workspace
          docker run --rm --network none \
            -v "$source_snapshot:/workspace:ro" \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/dist:/evidence" \
            "$TRIVY_IMAGE" fs --cache-dir /root/.cache/trivy \
            --skip-db-update --offline-scan --scanners vuln --format cyclonedx \
            --output /evidence/source-sbom.cdx.json /workspace
          rm -rf -- "$source_snapshot"
          run_image_scan() {
            docker run --rm --network none \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$TRIVY_CACHE:/root/.cache/trivy" \
              -v "$GITHUB_WORKSPACE:/source:ro" \
              -v "$GITHUB_WORKSPACE/dist:/evidence" \
              "$TRIVY_IMAGE" image --cache-dir /root/.cache/trivy \
              --skip-db-update --offline-scan "$@"
          }
          run_image_scan --scanners vuln,secret \
            --format json --output /evidence/runtime-scan.json "$IMAGE"
          run_image_scan --scanners vuln,secret \
            --format json --output /evidence/dapper-scan.json "$DAPPER_IMAGE"
          run_image_scan --scanners vuln \
            --vex /source/security/dapper.openvex.json \
            --format json --output /evidence/dapper-applicable-scan.json "$DAPPER_IMAGE"
          run_image_scan --scanners vuln --format cyclonedx \
            --output /evidence/runtime-sbom.cdx.json "$IMAGE"

          source_critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' dist/source-scan.json)
          source_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' dist/source-scan.json)
          source_secrets=$(jq '[.Results[]?.Secrets[]?] | length' dist/source-scan.json)
          runtime_critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' dist/runtime-scan.json)
          runtime_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' dist/runtime-scan.json)
          runtime_secrets=$(jq '[.Results[]?.Secrets[]?] | length' dist/runtime-scan.json)
          dapper_critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' dist/dapper-scan.json)
          dapper_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' dist/dapper-scan.json)
          dapper_applicable_critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' dist/dapper-applicable-scan.json)
          dapper_applicable_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' dist/dapper-applicable-scan.json)
          jq -n \
            --argjson source_secrets "$source_secrets" \
            --argjson source_critical "$source_critical" \
            --argjson source_high "$source_high" \
            --argjson runtime_critical "$runtime_critical" \
            --argjson runtime_high "$runtime_high" \
            --argjson runtime_secrets "$runtime_secrets" \
            --argjson dapper_critical "$dapper_critical" \
            --argjson dapper_high "$dapper_high" \
            --argjson dapper_applicable_critical "$dapper_applicable_critical" \
            --argjson dapper_applicable_high "$dapper_applicable_high" \
            '{source:{critical:$source_critical,high:$source_high,secrets:$source_secrets},runtime:{critical:$runtime_critical,high:$runtime_high,secrets:$runtime_secrets},build_environment:{raw:{critical:$dapper_critical,high:$dapper_high},applicable:{critical:$dapper_applicable_critical,high:$dapper_applicable_high},vex:"security/dapper.openvex.json"}}' \
            > dist/security-counts.json

      - name: Record evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z |
            xargs -0 sha256sum > dist/SHA256SUMS

      - name: Upload short-lived security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-agent-security-evidence-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

      - name: Enforce the recorded security result
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .source.critical == 0 and
            .source.high == 0 and
            .source.secrets == 0 and
            .runtime.critical == 0 and
            .runtime.high == 0 and
            .runtime.secrets == 0 and
            .build_environment.applicable.critical == 0 and
            .build_environment.applicable.high == 0
          ' dist/security-counts.json >/dev/null
          jq -e '.passed == true and .kubernetes == "1.36.4" and .clientGo == "0.36.4"' \
            dist/kubernetes-integration.json >/dev/null

      - name: Remove verification-only images and cache
        if: always()
        shell: bash
        run: |
          set +e
          docker image rm -f "$IMAGE" "$DAPPER_IMAGE" "$TRIVY_IMAGE" "$ETCD_TEST_IMAGE"
          docker builder prune --all --force
